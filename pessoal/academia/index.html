function downloadBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = toKey(today.getFullYear(), today.getMonth(), today.getDate());
  a.href = url;
  a.download = `atividade-fisica-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerRestore(){
  document.getElementById('restore-file-input').click();
}

function handleRestoreFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed.completed) || parsed.completed.length === 0){
        alert('Esse arquivo não parece ser um backup válido deste app.');
        return;
      }
      if(parsed.completed.length < TOTAL){
        const missing = TOTAL - parsed.completed.length;
        parsed.completed = parsed.completed.concat(Array(missing).fill(false));
        const emptyChecks = Array(missing).fill(null).map(() => Array(7).fill(false));
        parsed.checks = (parsed.checks || []).concat(emptyChecks);
      } else if(parsed.completed.length > TOTAL){
        parsed.completed = parsed.completed.slice(0, TOTAL);
        parsed.checks = (parsed.checks || []).slice(0, TOTAL);
      }
      if(!parsed.weights) parsed.weights = {};
      if(!parsed.sessionWeights) parsed.sessionWeights = {};
      if(!parsed.activities) parsed.activities = {};
      if(!parsed.seededVersion) parsed.seededVersion = 0;
      state = parsed;
      await saveState();
      render();
      alert('Backup restaurado com sucesso!');
    }catch(err){
      alert('Não consegui ler esse arquivo. Confira se é o JSON de backup certo.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function render(){
  const app = document.getElementById('app');
  const doneCount = state.completed.filter(Boolean).length;
  const pct = Math.round((doneCount/TOTAL)*100);
  const sel = state.selected;
  const session = SESSIONS[sel];
  const unlocked = isUnlocked(sel);
  const checks = state.checks[sel];
  const allChecked = checks.every(Boolean);

  let trilhaHtml = '<div class="trilha">';
  WAVES.forEach((wave, wi) => {
    trilhaHtml += `<div class="wave-group"><div class="wave-title">Ciclo ${wi+1}</div><div class="wave-nodes">`;
    SESSIONS.forEach((s, i) => {
      if(s.waveId !== wave.id) return;
      const unl = isUnlocked(i);
      const done = state.completed[i];
      const isSelected = i === sel;
      let cls = 'node';
      if(!unl) cls += ' locked';
      else if(done) cls += ' done';
      else cls += ' active';
      if(isSelected) cls += ' selected';
      const label = done ? '✓' : (i+1);
      trilhaHtml += `<div class="${cls}" onclick="selectSession(${i})" title="Sessão ${i+1}${!unl?' (bloqueada)':''}">${unl ? label : '🔒'}</div>`;
    });
    trilhaHtml += `</div></div>`;
    if(wi < WAVES.length-1) trilhaHtml += `<div class="wave-divider"></div>`;
  });
  trilhaHtml += '</div>';

  let bodyHtml;
  if(!unlocked){
    bodyHtml = `
      <div class="session-head">
        <div class="session-name">Sessão ${sel+1}</div>
        <div class="session-tag">bloqueada</div>
      </div>
      <div class="locked-msg">
        <span class="lock-icon">🔒</span>
        Termine a sessão anterior pra desbloquear esta aqui.
      </div>
    `;
  } else {
    const exRows = session.template.exercicios.map((ex, ei) => {
      const currentWeight = state.weights[ex.nome] !== undefined ? state.weights[ex.nome] : ex.carga;
      const isBodyweight = ex.carga === '0kg'; // peso corporal, sem carga adicional — julga pelo valor original do template
      const lastIdx = isBodyweight ? null : lastSessionForExercise(ex.nome, sel);
      const weightHist = isBodyweight ? [] : exerciseWeightHistory(ex.nome, sel);
      let lastInfo = '';
      if(weightHist.length >= 2){
        lastInfo = 'histórico: ' + weightHist.join(' → ');
      } else if(lastIdx !== null){
        lastInfo = 'última vez: sessão ' + (lastIdx+1);
      }
      return `
      <div class="ex-row">
        <div class="ex-check ${checks[ei]?'checked':''}" onclick="toggleCheck(${sel},${ei})"></div>
        <div class="ex-info">
          <div class="ex-name ${checks[ei]?'checked-text':''}">${ex.nome}</div>
          <div class="ex-group">${ex.grupo}</div>
        </div>
        <div class="ex-specs">
          <div class="ex-reps">${ex.series}x${ex.reps}</div>
          ${isBodyweight
            ? `<div class="ex-bodyweight-tag">peso corporal</div>`
            : `<input class="ex-weight-input" type="text" value="${currentWeight.replace(/"/g,'&quot;')}"
                onchange="updateWeight('${ex.nome.replace(/'/g,"\\'")}', this.value)" />`}
          ${lastInfo ? `<div class="ex-last-used">${lastInfo}</div>` : ''}
        </div>
        <a class="ex-video" href="${exerciseVideoLink(ex.nome)}" target="_blank" rel="noopener" title="Ver execução no YouTube">▶</a>
      </div>
    `;
    }).join('');

    let btnHtml;
    if(state.completed[sel]){
      btnHtml = `<button class="finish-btn done-state" disabled>✓ Treino concluído</button>`;
    } else if(allChecked){
      btnHtml = `<button class="finish-btn ready" onclick="completeSession(${sel})">Concluir treino e desbloquear próximo</button>`;
    } else {
      btnHtml = `<button class="finish-btn waiting" disabled>Marque todos os exercícios pra concluir</button>`;
    }

    bodyHtml = `
      <div class="session-head">
        <div class="session-name">${session.template.nome}</div>
        <div class="session-tag">Sessão ${sel+1} de ${TOTAL}</div>
      </div>
      <div class="session-meta">${session.waveLabel} · repetição ${session.repeatIndex} de 4</div>
      ${session.repeatIndex === 1 ? `<div class="wave-note">${session.waveNote}</div>` : ''}
      ${exRows}
      ${btnHtml}
    `;
  }

  app.innerHTML = `
    ${renderAuthBar()}
    <div class="backup-bar">
      <button class="backup-btn" onclick="downloadBackup()">⬇ Baixar backup</button>
      <button class="backup-btn" onclick="triggerRestore()">⬆ Restaurar backup</button>
      <input type="file" id="restore-file-input" accept="application/json" style="display:none;" onchange="handleRestoreFile(this)">
    </div>
    <div class="app-version">v${APP_VERSION}</div>
    ${saveErrorFlag ? `<div class="save-error-banner">⚠ Não consegui salvar essa alteração agora (falha no armazenamento). Baixe um backup pra não perder nada, e tente recarregar a página.</div>` : ''}
    <h1>ATIVIDADE FÍSICA</h1>

    <div class="tabs" style="margin-bottom:6px;">
      <button class="tab-btn ${activeTab==='calendario'?'active':''}" onclick="setTab('calendario')">Calendário</button>
      <button class="tab-btn ${activeTab==='balanca'?'active':''}" onclick="setTab('balanca')">Peso</button>
    </div>
    <div class="tabs">
      <button class="tab-btn ${activeTab==='musculacao'?'active':''}" onclick="setTab('musculacao')">Musculação</button>
      <button class="tab-btn ${activeTab==='abdominal'?'active':''}" onclick="setTab('abdominal')">Abdominal</button>
      <button class="tab-btn ${activeTab==='alongamento'?'active':''}" onclick="setTab('alongamento')">Alongamento</button>
    </div>

    ${activeTab === 'calendario' ? `
      ${renderDashboard()}
      <div class="cal-card">${renderCalendar()}</div>
    ` : activeTab === 'musculacao' ? `
      <div class="progress-card">
        <div class="progress-top">
          <div class="progress-num">${doneCount}<span> / ${TOTAL} treinos</span></div>
          <div class="progress-label">${pct}% do trimestre</div>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>

      <div class="trilha-scroll">${trilhaHtml}</div>

      <div class="session-card">${bodyHtml}</div>
    ` : activeTab === 'abdominal' ? renderAbdominal() : activeTab === 'alongamento' ? renderAlongamento() : renderBalanca()}
  `;
}

loadState();

// Registra o service worker (Fase 5.1 — funcionar offline). Falha em
// silêncio se o navegador não suportar ou se o SW não puder ser servido
// (ex.: abrindo o arquivo local sem servidor) — o app continua funcionando
// normalmente, só sem o cache offline.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
